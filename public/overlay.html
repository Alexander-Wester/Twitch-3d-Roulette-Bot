<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rhino's Roulette</title>

    <style>

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }


        #connection-status {
            position: absolute;

            left: 20px;
            bottom: 20px;

            padding: 8px 12px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            color: white;

            background:
                rgba(0, 0, 0, 0.65);

            border-radius: 6px;
        }

    </style>

</head>


<body>

    <div id="connection-status">
        Connecting...
    </div>


    <script>

        const statusElement =
            document.getElementById(
                "connection-status"
            );


        function connectToBot() {

            const socket =
                new WebSocket(
                    `ws://${window.location.host}`
                );


            socket.addEventListener(
                "open",
                () => {

                    statusElement.textContent =
                        "Bot connected";

                }
            );


            socket.addEventListener(
                "close",
                () => {

                    statusElement.textContent =
                        "Bot disconnected";

                    setTimeout(
                        connectToBot,
                        2000
                    );

                }
            );

        }


        connectToBot();

    </script>


    <script
        type="module"
        src="/roulette.js"
    ></script>

</body>

</html>
